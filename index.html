<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#173b57">
<link rel="manifest" href="manifest.json">
<title>Yemekhane Yoklama</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6f8;color:#18212b;margin:0;padding:16px;max-width:620px;margin:auto}
header{background:#173b57;color:white;padding:20px;border-radius:16px}h1{font-size:23px;margin:0 0 6px}
.card{background:white;padding:16px;border-radius:15px;margin:14px 0;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccd5dd;border-radius:10px;font-size:17px}
.student{border:1px solid #dce3e8;border-radius:12px;padding:14px;margin-top:14px}.name{font-size:21px;font-weight:750}.muted,.small{color:#687684;font-size:13px}
button{cursor:pointer}.primary{width:100%;padding:15px;background:#176b4b;color:white;border:0;border-radius:11px;font-size:16px;font-weight:700;margin-top:12px}
.secondary{padding:12px;background:#e8eef3;color:#173b57;border:0;border-radius:10px;font-weight:650;flex:1}.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}li{padding:7px 0;border-bottom:1px solid #eee}#notice{color:#176b4b;font-size:13px;min-height:18px}
</style></head><body>
<header><h1>Yemekhane Yoklama</h1><div>Çevrimdışı deneme · Saat kaydı tutulmaz</div></header>
<section class="card"><label for="search">Öğrenci ara</label><input id="search" placeholder="Adını söyleyin veya yazın" autocomplete="off"><p class="small">Sesle aramak için iPhone klavyesindeki mikrofon simgesini kullanın.</p>
<div id="student" class="student"><div class="name">Toprak Arpacı</div><div class="muted">1-A · Öğrenci No: 0001</div><div id="status" class="small"></div><button id="mark" class="primary">Bugün geldi olarak kaydet</button></div><div id="notice"></div></section>
<section class="card"><b>Bu telefondaki kayıtlar</b><p class="small">Kayıtlar bu cihazda saklanır. Diğer iPhone ile otomatik eşitlenmez.</p><div id="records"></div><div class="row"><button id="export" class="secondary">CSV dışa aktar</button><button id="importBtn" class="secondary">Diğer telefondan al</button></div><input id="file" type="file" accept=".csv,text/csv" hidden></section>
<script>
const K='yemekhane_demo_v1',today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},get=()=>JSON.parse(localStorage.getItem(K)||'[]'),put=x=>localStorage.setItem(K,JSON.stringify(x));
function render(){let a=get().sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('status').textContent=a.some(x=>x.date===today())?'Bugün için kayıt mevcut.':'Bugün henüz kayıt yok.';document.getElementById('records').innerHTML=a.length?'<ul>'+a.map(x=>'<li>'+x.date+' — '+x.name+' ('+x.className+')</li>').join('')+'</ul>':'<p class="small">Henüz kayıt yok.</p>'}
document.getElementById('search').oninput=e=>{let q=e.target.value.trim().toLocaleLowerCase('tr-TR');document.getElementById('student').style.display=(!q||'toprak arpacı 1-a 0001'.includes(q))?'block':'none'};
document.getElementById('mark').onclick=()=>{let a=get();a.push({date:today(),studentId:'0001',name:'Toprak Arpacı',className:'1-A'});put(a);document.getElementById('notice').textContent='Kayıt bu telefona kaydedildi.';render()};
document.getElementById('export').onclick=()=>{let a=[['Tarih','Öğrenci No','Ad Soyad','Sınıf'],...get().map(x=>[x.date,x.studentId,x.name,x.className])];let csv='\ufeff'+a.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let el=document.createElement('a');el.href=u;el.download='yemekhane_kayitlari.csv';el.click();URL.revokeObjectURL(u)};
document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).slice(1).filter(Boolean),a=get();for(let line of t){let c=line.split(';').map(v=>v.replace(/^"|"$/g,'').replace(/""/g,'"'));if(c.length>=4)a.push({date:c[0],studentId:c[1],name:c[2],className:c[3]})}put(a);document.getElementById('notice').textContent='Diğer telefondan kayıtlar eklendi.';render();e.target.value=''};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script></body></html>
